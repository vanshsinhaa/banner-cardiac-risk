# CI for the EKG upload API prototype in services/upload-api.
# Stage 1 runs the tests. Stage 2 builds the Docker image and checks
# that the container answers /health. Stage 2 only runs if stage 1 passes.
# Nothing is pushed to a registry and nothing is deployed.
name: Upload API CI

on:
  push:
  pull_request:
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

# The jobs only need to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/upload-api
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/upload-api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test # skipped if any test fails
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag ekg-upload-api:ci services/upload-api

      - name: Start container and check /health
        run: |
          docker run --detach --name upload-api --publish 8000:8000 ekg-upload-api:ci
          for attempt in $(seq 1 15); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy. Logs:"
          docker logs upload-api
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force upload-api || true
